@if (open()) {
    <div class="fixed inset-0 z-[9999] flex items-center justify-center px-4">
        <div 
            class="fixed inset-0 backdrop-blur-sm"
            (click)="onCancel()">
        </div>

        <div class="relative bg-[var(--color-bg)] rounded-2xl shadow-2xl w-full max-w-md z-10 animate-slideUp">
            <header class="flex justify-between items-center px-6 py-4 border-b border-[var(--color-border)]">
                <h2 class="text-xl font-bold text-[var(--color-text)]">{{ title }}</h2>
                <button 
                    (click)="onCancel()"
                    class="hover:bg-[var(--color-border)] p-2 rounded-full transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                    </svg>
                </button>
            </header>

            <div class="px-6 py-6">
                <p class="text-[var(--color-text)] text-center">{{ message }}</p>
            </div>

            <footer class="flex justify-end gap-3 px-6 py-4 border-t border-[var(--color-border)]">
                <button 
                    type="button"
                    (click)="onCancel()"
                    class="px-6 py-2 border border-[var(--color-border)] rounded-lg font-semibold text-[var(--color-text)] 
                           hover:bg-[var(--color-border)] transition-colors">
                    Cancelar
                </button>
                <button 
                    type="button"
                    (click)="onConfirm()"
                    class="px-6 py-2 bg-red-500 text-white rounded-lg font-semibold 
                           hover:bg-red-600 transition-colors">
                    Confirmar
                </button>
            </footer>
        </div>
    </div>
}
