
<div class="flex flex-col gap-2 items-stretch justify-center border-l border-r border-[var(--color-border)] w-full pt-4">
    <div class="flex gap-2 justify-center sticky top-0 bg-[var(--color-bg)] z-10 py-2">
        <h1 class="text-center font-bold">For you</h1>
        <div class="bg-[var(--color-input)] text-[var(--color-text)] border-[var(--color-border)] border p-1 rounded-full pulse">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
                <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
            </svg>
        </div>
    </div>

    <app-create-post></app-create-post>

    @for (item of posts(); track item._id) {
        <app-post 
            [title]="item.title" 
            [content]="item.message" 
            [imageUrl]="item.photo" 
            [author]="item.author.username" 
            [authorPhoto]="item.author.photo" 
            [date]="item.createdAt" 
            [id]="item._id"
            [likes]="item.likes"
            [likeCount]="item.likeCount"
            [commentCount]="item.commentCount" 
            [comments]="item.comments"
            [mediaType]="item.mediaType" />
    }


    <div class="flex justify-center items-center gap-2 my-4">
        <button
            class="px-3 py-1 border rounded disabled:opacity-50"
            (click)="loadPage(currentPage() - 1)"
            [disabled]="currentPage() === 1"
        >
        ‹ Previous
        </button>


        @for (page of [].constructor(totalPages()); track $index) {
            <button
                class="px-3 py-1 border rounded"
                [class.bg-[var(--color-primary)]]="($index + 1) === currentPage()"
                (click)="loadPage($index + 1)"
            >
                {{ $index + 1 }}
            </button>
        }

        <button
            class="px-3 py-1 border rounded disabled:opacity-50"
            (click)="loadPage(currentPage() + 1)"
            [disabled]="currentPage() === totalPages()"
        >
        Next ›
        </button>
  </div>
  @if(loading()) {
      <div class="fixed top-0 left-0 right-0 bottom-0 flex justify-center items-center backdrop-blur-sm">
          <spinner></spinner>
      </div>
  }
</div>
