@if (toast(); as t) {
    <div class="fixed bottom-4 right-4 left-4 px-4 py-2 m-auto rounded-lg shadow-lg text-white font-medium 
        max-w-sm sm:max-w-md md:max-w-lg 
        animate-slide-up z-[9999] flex gap-2 items-center justify-between"
    [class.bg-[var(--color-success)]]="t.type === 'success'"
    [class.bg-[var(--color-danger)]]="t.type === 'error'"
    [class.bg-info]="t.type === 'info'"
    [class.bg-warning]="t.type === 'warning'">
    
      <div class="flex items-center gap-2">
        @if(t.type === 'success') {
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
          </svg>  
        } @else if (t.type === "error") {
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="m9.75 9.75 4.5 4.5m0-4.5-4.5 4.5M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
          </svg>
        } @else if (t.type === "warning") {
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
          </svg>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" />
          </svg>
        }

        <div class="flex flex-col">
          <p class="text-lg">{{ t.message }}</p>
          @if (t.description) {
            <p class="text-sm opacity-75">
              {{ t.description }}
            </p>
          }
        </div>
      </div>

      <button class="cursor-pointer" (click)="dismiss()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      </button>
  </div>
}
