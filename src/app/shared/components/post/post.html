<section class="flex flex-col gap-4 border-b border-[var(--color-border)] py-4">
    <header class="flex justify-start items-center gap-2 w-full px-4">
        <img [src]="authorPhoto()" alt="" class="rounded-full w-12 h-12">
        <div class="flex items-center gap-1">
            <span class="font-bold text-xl">{{author()}}</span>
            <span>•</span>
            <span class="text-[var(--color-muted)] text-sm mt-1">{{date() | date:'short'}}</span>
        </div>
    </header>

    <main class="flex flex-col justify-start items-start gap-2 w-full px-4 ">
        <h1 class="text-2xl font-bold">{{title()}}</h1>
        <p class="text-[var(--color-muted)] text-sm">{{content()}}</p>
        @if (imageUrl() != null) {
            <img src="{{imageUrl()}}" alt="Post Image" class="w-full h-96 object-cover rounded-xl mt-2" />
        }
    </main>

    <footer class="flex justify-between items-center w-full px-4">
        <div class="hover:bg-[var(--color-accent)] hover:bg-opacity-50 p-1 rounded-full cursor-pointer transition-colors duration-300 ease-in-out">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12.76c0 1.6 1.123 2.994 2.707 3.227 1.087.16 2.185.283 3.293.369V21l4.076-4.076a1.526 1.526 0 0 1 1.037-.443 48.282 48.282 0 0 0 5.68-.494c1.584-.233 2.707-1.626 2.707-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0 0 12 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741v6.018Z" />
            </svg>
        </div>
        
        <button 
            (click)="likePost()" 
            class="flex items-center gap-1 hover:bg-[var(--color-danger)] hover:bg-opacity-50 p-2 rounded-full cursor-pointer transition-all duration-300 ease-in-out group">
            @if (isLiked()) {
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="size-6 text-red-500">
                    <path d="M11.645 20.91l-.007-.003-.022-.012a15.247 15.247 0 0 1-.383-.218 25.18 25.18 0 0 1-4.244-3.17C4.688 15.36 2.25 12.174 2.25 8.25 2.25 5.322 4.714 3 7.688 3A5.5 5.5 0 0 1 12 5.052 5.5 5.5 0 0 1 16.313 3c2.973 0 5.437 2.322 5.437 5.25 0 3.925-2.438 7.111-4.739 9.256a25.175 25.175 0 0 1-4.244 3.17 15.247 15.247 0 0 1-.383.219l-.022.012-.007.004-.003.001a.752.752 0 0 1-.704 0l-.003-.001Z" />
                </svg>
            } @else {
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6 group-hover:text-red-500 transition-colors">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z" />
                </svg>
            }
            @if (localLikeCount() > 0) {
                <span class="text-sm font-semibold" [class.text-red-500]="isLiked()">
                    {{ localLikeCount() }}
                </span>
            }
        </button>
        
        <div class="hover:bg-[var(--color-success)] hover:bg-opacity-50 p-1 rounded-full cursor-pointer transition-colors duration-300 ease-in-out">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 12c0-1.232-.046-2.453-.138-3.662a4.006 4.006 0 0 0-3.7-3.7 48.678 48.678 0 0 0-7.324 0 4.006 4.006 0 0 0-3.7 3.7c-.017.22-.032.441-.046.662M19.5 12l3-3m-3 3-3-3m-12 3c0 1.232.046 2.453.138 3.662a4.006 4.006 0 0 0 3.7 3.7 48.656 48.656 0 0 0 7.324 0 4.006 4.006 0 0 0 3.7-3.7c.017-.22.032-.441.046-.662M4.5 12l3 3m-3-3-3 3" />
            </svg>
        </div>
        <div class="hover:bg-[var(--color-primary)] hover:bg-opacity-50 p-1 rounded-full cursor-pointer transition-colors duration-300 ease-in-out">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                <path stroke-linecap="round" stroke-linejoin="round" d="M7.217 10.907a2.25 2.25 0 1 0 0 2.186m0-2.186c.18.324.283.696.283 1.093s-.103.77-.283 1.093m0-2.186 9.566-5.314m-9.566 7.5 9.566 5.314m0 0a2.25 2.25 0 1 0 3.935 2.186 2.25 2.25 0 0 0-3.935-2.186Zm0-12.814a2.25 2.25 0 1 0 3.933-2.185 2.25 2.25 0 0 0-3.933 2.185Z" />
            </svg>
        </div>

    </footer>
</section>
