<app-auth-header></app-auth-header>

<app-auth-layout-card >
    <h1 class="text-center font-bold text-xl">Nexoria</h1>
    <h2 class="text-center font-semibold mt-2">Create Account</h2>

    <form class="flex flex-col gap-2 mt-6" (ngSubmit)="onSubmit($event)" [formGroup]="userRegisterForm">
        <div class="flex flex-col sm:flex-row gap-2 sm:gap-4 w-full">
            <app-auth-input
                label="Name"
                type="text"
                placeHolder="Enter your name"
                [control]="userRegisterForm.get('name')"
                [errorMessage]="formUtils.getFieldError(userRegisterForm, 'name')"
                class="w-full"
            ></app-auth-input>

            <app-auth-input
                label="Last Name"
                type="text"
                placeHolder="Enter your last name"
                [control]="userRegisterForm.get('lastName')"
                [errorMessage]="formUtils.getFieldError(userRegisterForm, 'lastName')"
                class="w-full"
            ></app-auth-input>
        </div>

        <app-auth-input
            label="Email"
            type="email"
            placeHolder="Enter your email"
            [control]="userRegisterForm.get('email')"
            [errorMessage]="formUtils.getFieldError(userRegisterForm, 'email')"
        ></app-auth-input>

        <div class="flex flex-col sm:flex-row gap-2 sm:gap-4 w-full">
            <app-auth-input
                label="Username"
                type="text"
                placeHolder="Enter your username"
                [control]="userRegisterForm.get('userName')"
                [errorMessage]="formUtils.getFieldError(userRegisterForm, 'userName')"
                class="w-full"
            ></app-auth-input>

            <app-auth-input
                label="Date of Birth"
                type="date"
                placeHolder="Enter your date of birth"
                [control]="userRegisterForm.get('date')"
                [errorMessage]="formUtils.getFieldError(userRegisterForm, 'date')"
                class="w-full"
            ></app-auth-input>
        </div>

        <div class="flex flex-col sm:flex-row gap-2 sm:gap-4 w-full">
            <app-auth-input
                label="Password"
                type="password"
                placeHolder="Enter your password"
                [control]="userRegisterForm.get('password')"
                [errorMessage]="formUtils.getFieldError(userRegisterForm, 'password')"
                class="w-full"
            ></app-auth-input>

            <app-auth-input
                label="Confirm Password"
                type="password"
                placeHolder="Confirm your password"
                [control]="userRegisterForm.get('confirmPassword')"
                [errorMessage]="formUtils.getFieldError(userRegisterForm, 'confirmPassword')"
                class="w-full"
            ></app-auth-input>
        </div>

        <app-auth-input
            label="Description"
            type="text"
            placeHolder="Enter a short description about you"
            [control]="userRegisterForm.get('description')"
            [errorMessage]="formUtils.getFieldError(userRegisterForm, 'description')"
        >
        </app-auth-input>

        <label for="photo" class="text-sm text-[var(--color-muted)] font-medium">Profile Picture</label>
        <input
            id="photo"
            type="file"
            accept="image/*"
            (change)="onFileSelected($event)"
            class="p-2 w-full text-sm text-[var(--color-muted)] m-0 border rounded-3xl cursor-pointer bg-[var(--color-input)]
            focus:ring-[var(--color-primary)] border-[var(--color-border)] text-[var(--color-text)]"
        />
        <!-- @if (formUtils.getFieldError(userRegisterForm, 'photo')) {
            <p class="text-red-500 text-sm mt-1">{{ formUtils.getFieldError(userRegisterForm, 'photo') }}</p>
        } -->

        
        <app-auth-button
        title="Sign up"
        [disabled]="userRegisterForm.invalid"
        />
        
        @if(message()) {
            <p class="text-white text-sm bg-[var(--color-danger)] p-2 rounded-lg text-center">{{ message() }}</p>
        }

        @if(loading()) {
            <div class="flex justify-center">
                <spinner></spinner>
            </div>
        }
        
        <hr class="border-t border-[var(--color-border)] my-2">

        <p class="text-center text-[var(--color-muted)] text-sm">Already have an account? 
            <a href="/login" class="text-[var(--color-primary)] font-bold underline">Log in</a>
        </p>
    </form>

</app-auth-layout-card>
