<section class="max-w-6xl mx-auto px-6 py-6 flex flex-col gap-6">
  <header class="flex items-center justify-between gap-4">
    <div>
      <h1 class="text-xl font-semibold">Statistics</h1>
      <p class="text-sm">
        Posts and comments activity over time.
      </p>
    </div>

    <form
      [formGroup]="rangeForm"
      (ngSubmit)="applyRange($event)"
      class="flex flex-wrap items-center gap-3 text-sm"
    >
      <label class="flex items-center gap-2">
        <span>From</span>
        <input
          type="date"
          formControlName="from"
          class="px-2 py-1 rounded-md border border-[var(--color-border)] bg-[var(--color-bg)]"
        />
      </label>

      <label class="flex items-center gap-2">
        <span>To</span>
        <input
          type="date"
          formControlName="to"
          class="px-2 py-1 rounded-md border border-[var(--color-border)] bg-[var(--color-bg)]"
        />
      </label>

      <button
        type="submit"
        class="px-4 py-2 rounded-md bg-[var(--color-text)] text-[var(--color-bg)] font-medium hover:opacity-90 cursor-pointer"
      >
        Apply
      </button>
    </form>
  </header>

  @if(error()) {
    <p class="text-sm text-[var(--color-danger)]">{{ error() }}</p>
  }

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    <div class="bg-[var(--color-surface)] border border-[var(--color-border)] rounded-xl p-4">
      <apx-chart
        [series]="postsPerUserOptions.series || []"
        [chart]="postsPerUserOptions.chart!"
        [xaxis]="postsPerUserOptions.xaxis!"
        [dataLabels]="postsPerUserOptions.dataLabels!"
        [plotOptions]="postsPerUserOptions.plotOptions!"
        [title]="postsPerUserOptions.title!"
      ></apx-chart>
    </div>

    <div class="bg-[var(--color-surface)] border border-[var(--color-border)] rounded-xl p-4">
      <apx-chart
        [series]="commentsOverTimeOptions.series!"
        [chart]="commentsOverTimeOptions.chart!"
        [xaxis]="commentsOverTimeOptions.xaxis!"
        [dataLabels]="commentsOverTimeOptions.dataLabels!"
        [stroke]="commentsOverTimeOptions.stroke!"
        [title]="commentsOverTimeOptions.title!"
      ></apx-chart>
    </div>

    <!-- Comments per post (donut) -->
    <div
      class="bg-[var(--color-surface)] border border-[var(--color-border)] rounded-xl p-4 lg:col-span-2"
    >
      <apx-chart
        [series]="commentsPerPostOptions.series!"
        [chart]="commentsPerPostOptions.chart!"
        [labels]="commentsPerPostOptions.labels!"
        [title]="commentsPerPostOptions.title!"
      ></apx-chart>
    </div>
  </div>

</section>

@if(loading()) {
    <div class="fixed top-0 left-0 right-0 bottom-0 flex justify-center items-center backdrop-blur-sm">
        <spinner></spinner>
    </div>
}
