<div class="flex gap-2 items-center justify-center">
    <div class="border border-[var(--color-border)] w-2xl rounded-3xl bg-[var(--color-surface)] p-2">
        <h1 class="text-center text-xl text-[var(--color-text)] font-bold">Account</h1>
        <hr class="border-t border-[var(--color-border)] my-2">

        <div class="relative w-30 h-30 m-auto group">
            <img [src]="profile()?.photo" [alt]="profile()?.name" class="size-30 rounded-3xl"/>
            
            <button 
                class="absolute bottom-0 right-0 bg-[var(--color-primary)] text-white p-2 rounded-full 
                opacity-0 group-hover:opacity-100 transition-opacity duration-300 cursor-pointer
                shadow-lg"
                title="Edit photo">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" />
                </svg>
            </button>
        </div>

        <div class="relative flex justify-between items-center max-w-sm m-auto mt-4 mb-2 group">
            <p>Name</p>
            <div class="flex items-center">
                <h2 class="text-center text-[var(--color-text)] mt-2">{{ profile()?.name }}</h2>
                <button 
                    class="absolute -right-8 bg-[var(--color-primary)] text-white p-1.5 rounded-full 
                    opacity-0 group-hover:opacity-100 transition-opacity duration-300 cursor-pointer
                    shadow-lg"
                    title="Edit name">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-3 h-3">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" />
                    </svg>
                </button>
            </div>
        </div>

        <div class="relative flex justify-between items-center max-w-sm m-auto mt-4 mb-2 group">
            <p>Email</p>
            <div class="flex items-center">
                <p class="text-center text-[var(--color-text-secondary)]">{{ profile()?.email }}</p>
                <button 
                    class="absolute -right-8 bg-[var(--color-primary)] text-white p-1.5 rounded-full 
                    opacity-0 group-hover:opacity-100 transition-opacity duration-300 cursor-pointer
                    shadow-lg"
                    title="Edit email">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-3 h-3">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" />
                    </svg>
                </button>
            </div>
        </div>

        <div class="relative flex justify-between items-center max-w-sm m-auto mt-4 mb-2 group">
            <p>Description</p>
            <div class="flex items-center">
                <p class="text-center text-[var(--color-text-secondary)] px-2 rounded-3xl">{{ profile()?.description }}</p>
                <button 
                    class="absolute -right-8 bg-[var(--color-primary)] text-white p-1.5 rounded-full 
                    opacity-0 group-hover:opacity-100 transition-opacity duration-300 cursor-pointer
                    shadow-lg"
                    title="Edit description">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-3 h-3">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10" />
                    </svg>
                </button>
            </div>
        </div>

        <div class="flex my-4">
            <button class="bg-[var(--color-danger)] w-full max-w-sm m-auto py-2 rounded-lg cursor-pointer hover:opacity-90 transition-opacity">
                Delete my Account
            </button>
        </div>

        <hr class="border-t border-[var(--color-border)] my-2">

        <h2 class="text-center text-lg text-[var(--color-text)] font-bold">Latest Activity</h2>

    </div>
</div>
