<app-auth-header></app-auth-header>

<app-auth-layout-card>
    <div class="flex flex-col items-center gap-4 py-6 text-center">
        @if (loading()) {
            <spinner></spinner>
        }

        <div class="space-y-2">
            <h1 class="text-2xl font-bold text-[var(--color-text)]">Connecting your account</h1>
            <p class="text-sm text-[var(--color-muted)]">{{ message() }}</p>
        </div>
    </div>
</app-auth-layout-card>
