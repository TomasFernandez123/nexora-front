<div class="sticky top-0 flex flex-col gap-4 px-4 py-2">
  <input
    type="text"
    placeholder="Search..."
    class="px-4 py-2.5 w-full border rounded-full bg-[var(--color-input)] text-[var(--color-text)] text-sm focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)] border-[var(--color-border)]"
  />

  <div class="border border-[var(--color-border)] w-full rounded-2xl py-3 px-4 bg-[var(--color-surface)]">
    <h1 class="font-extrabold text-2xl text-[var(--color-text)]">Who to follow</h1>
    <hr class="border-[var(--color-border)] my-3" />

    @for (user of users(); track user._id) {
      <app-suggestion-to-follow
        [user]="user"
        (followed)="onFollowed($event)"
      ></app-suggestion-to-follow>
    } @empty {
      <p class="text-center text-[var(--color-muted)] font-semibold">No more suggestions</p>
    }
  </div>
</div>
