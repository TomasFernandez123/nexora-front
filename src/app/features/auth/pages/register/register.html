<app-magnetic-cursor />
<app-particle-canvas />
<app-auth-header></app-auth-header>

<app-auth-layout-card>
  <h1 class="text-center font-bold text-2xl sm:text-3xl">Nexora</h1>
  <app-watcher-avatar />
  <h2 class="text-center font-semibold mt-2 text-lg sm:text-xl">Create Account</h2>

  <form
    class="flex flex-col gap-3 sm:gap-4 mt-4 sm:mt-6"
    (ngSubmit)="onSubmit($event)"
    [formGroup]="userRegisterForm"
  >
    <div class="flex flex-col sm:flex-row gap-3 sm:gap-4 w-full">
      <app-auth-input
        label="Name"
        type="text"
        placeHolder="Enter your name"
        [control]="userRegisterForm.get('name')"
        [errorMessage]="formUtils.getFieldError(userRegisterForm, 'name')"
        class="w-full"
      ></app-auth-input>

      <app-auth-input
        label="Last Name"
        type="text"
        placeHolder="Enter your last name"
        [control]="userRegisterForm.get('lastName')"
        [errorMessage]="formUtils.getFieldError(userRegisterForm, 'lastName')"
        class="w-full"
      ></app-auth-input>
    </div>

    <app-auth-input
      label="Email"
      type="email"
      placeHolder="Enter your email"
      [control]="userRegisterForm.get('email')"
      [errorMessage]="formUtils.getFieldError(userRegisterForm, 'email')"
    ></app-auth-input>

    <div class="flex flex-col sm:flex-row gap-3 sm:gap-4 w-full">
      <app-auth-input
        label="Username"
        type="text"
        placeHolder="Enter your username"
        [control]="userRegisterForm.get('userName')"
        [errorMessage]="formUtils.getFieldError(userRegisterForm, 'userName')"
        class="w-full"
      ></app-auth-input>

      <app-auth-input
        label="Date of Birth"
        type="date"
        placeHolder="Enter your date of birth"
        [control]="userRegisterForm.get('date')"
        [errorMessage]="formUtils.getFieldError(userRegisterForm, 'date')"
        class="w-full"
      ></app-auth-input>
    </div>

    <div class="flex flex-col sm:flex-row gap-3 sm:gap-4 w-full">
      <app-auth-input
        label="Password"
        type="password"
        placeHolder="Enter your password"
        [control]="userRegisterForm.get('password')"
        [errorMessage]="formUtils.getFieldError(userRegisterForm, 'password')"
        class="w-full"
      ></app-auth-input>

      <app-auth-input
        label="Confirm Password"
        type="password"
        placeHolder="Confirm your password"
        [control]="userRegisterForm.get('confirmPassword')"
        [errorMessage]="formUtils.getFieldError(userRegisterForm, 'confirmPassword')"
        class="w-full"
      ></app-auth-input>
    </div>

    <app-auth-input
      label="Description"
      type="text"
      placeHolder="Enter a short description about you"
      [control]="userRegisterForm.get('description')"
      [errorMessage]="formUtils.getFieldError(userRegisterForm, 'description')"
    >
    </app-auth-input>

    <label for="photo" class="text-sm text-[var(--color-muted)] font-medium mt-1"
      >Profile Picture</label
    >
    <input
      id="photo"
      type="file"
      accept="image/*"
      (change)="onFileSelected($event)"
      class="p-2 sm:p-3 w-full text-xs sm:text-sm text-[var(--color-muted)] m-0 border rounded-2xl sm:rounded-3xl cursor-pointer bg-[var(--color-input)] focus:ring-[var(--color-primary)] border-[var(--color-border)] text-[var(--color-text)]"
    />
    <!-- @if (formUtils.getFieldError(userRegisterForm, 'photo')) {
            <p class="text-red-500 text-sm mt-1">{{ formUtils.getFieldError(userRegisterForm, 'photo') }}</p>
        } -->

    <app-auth-button title="Sign up" [disabled]="userRegisterForm.invalid" />

    @if (message()) {
      <p class="text-white text-sm bg-[var(--color-danger)] p-2 rounded-lg text-center">
        {{ message() }}
      </p>
    }

    @if (loading()) {
      <div class="flex justify-center">
        <spinner></spinner>
      </div>
    }

    <hr class="border-t border-[var(--color-border)] my-2" />

    <div class="grid gap-3 sm:grid-cols-2">
      <button
        type="button"
        class="flex w-full items-center justify-center gap-3 rounded-lg border border-[var(--color-border)] bg-[var(--color-surface)] px-4 py-2.5 font-medium text-[var(--color-text)] shadow-sm transition hover:border-[var(--color-text)] hover:bg-[color-mix(in_srgb,var(--color-surface)_92%,var(--color-text)_8%)] focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)] focus:ring-offset-2 focus:ring-offset-[var(--color-surface)]"
        (click)="onSocialRegister('google')"
        aria-label="Sign up with Google"
      >
        <svg aria-hidden="true" class="h-5 w-5" viewBox="0 0 24 24" fill="none">
          <path
            d="M21.805 10.023H12.24v3.955h5.468c-.236 1.272-.959 2.35-2.006 3.073v2.55h3.243c1.899-1.748 2.99-4.324 2.99-7.383 0-.73-.065-1.43-.13-2.195Z"
            fill="#4285F4"
          />
          <path
            d="M12.24 22c2.736 0 5.03-.905 6.706-2.446l-3.243-2.55c-.905.608-2.06.972-3.463.972-2.642 0-4.88-1.783-5.679-4.18H3.215v2.63A10.124 10.124 0 0 0 12.24 22Z"
            fill="#34A853"
          />
          <path
            d="M6.561 13.796A6.078 6.078 0 0 1 6.243 12c0-.623.112-1.228.318-1.796v-2.63H3.215A10.124 10.124 0 0 0 2.16 12c0 1.634.392 3.183 1.056 4.426l3.345-2.63Z"
            fill="#FBBC05"
          />
          <path
            d="M12.24 6.024c1.496 0 2.829.514 3.884 1.522l2.913-2.913C17.266 2.98 14.972 2 12.24 2A10.124 10.124 0 0 0 3.215 7.574l3.345 2.63c.798-2.398 3.036-4.18 5.679-4.18Z"
            fill="#EA4335"
          />
        </svg>
        <span>Google</span>
      </button>

      <button
        type="button"
        class="flex w-full items-center justify-center gap-3 rounded-lg border border-[var(--color-border)] bg-[var(--color-surface)] px-4 py-2.5 font-medium text-[var(--color-text)] shadow-sm transition hover:border-[var(--color-text)] hover:bg-[color-mix(in_srgb,var(--color-surface)_92%,var(--color-text)_8%)] focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)] focus:ring-offset-2 focus:ring-offset-[var(--color-surface)]"
        (click)="onSocialRegister('github')"
        aria-label="Sign up with GitHub"
      >
        <svg aria-hidden="true" class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M12 2C6.477 2 2 6.589 2 12.248c0 4.526 2.865 8.366 6.839 9.721.5.095.683-.221.683-.492 0-.244-.009-.889-.014-1.744-2.782.617-3.369-1.373-3.369-1.373-.455-1.184-1.111-1.499-1.111-1.499-.909-.638.069-.625.069-.625 1.004.072 1.532 1.054 1.532 1.054.893 1.566 2.341 1.114 2.91.852.091-.664.349-1.114.635-1.37-2.221-.258-4.555-1.14-4.555-5.072 0-1.12.389-2.036 1.029-2.754-.103-.259-.446-1.3.098-2.709 0 0 .84-.277 2.75 1.052A9.303 9.303 0 0 1 12 6.853a9.27 9.27 0 0 1 2.505.349c1.909-1.329 2.748-1.052 2.748-1.052.546 1.409.202 2.45.1 2.709.641.718 1.028 1.634 1.028 2.754 0 3.942-2.338 4.811-4.566 5.064.359.318.678.946.678 1.907 0 1.377-.012 2.487-.012 2.826 0 .273.18.591.688.491C19.138 20.611 22 16.772 22 12.248 22 6.589 17.523 2 12 2Z"
          />
        </svg>
        <span>GitHub</span>
      </button>
    </div>

    <p class="text-center text-[var(--color-muted)] text-sm">
      Already have an account?
      <a href="/login" class="text-[var(--color-primary)] font-bold underline">Log in</a>
    </p>
  </form>
</app-auth-layout-card>
