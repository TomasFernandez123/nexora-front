<div class="fixed top-0 left-0 right-0 bottom-0 bg-black/50 backdrop-blur-sm flex justify-center z-10 
    p-10 fadeIn" (click)="onOverlayClick($event)">
    <div class="bg-[var(--color-bg)] border border-[var(--color-border)] w-full flex flex-col
        max-w-xl rounded-lg shadow-lg slideUp" (click)="$event.stopPropagation()">
        <div class="flex justify-between items-center p-4 border-b border-[var(--color-border)]">
            <h2 class="text-2xl font-semibold">{{ title() }}</h2>
            <button 
                type="button"
                class="bg-none border-none p-2 rounded-full hover:bg-[var(--color-border)] transition-colors duration-300 cursor-pointer" 
                (click)="onClose()"
                aria-label="Close modal">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="size-6">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <div class="p-6 overflow-y-auto">
            <ng-content></ng-content>
        </div>
    </div>
</div>
