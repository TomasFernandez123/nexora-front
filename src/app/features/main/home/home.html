<div
  class="flex flex-col gap-2 items-stretch justify-start border-l border-r border-[var(--color-border)] w-full min-h-screen pt-11 lg:pt-0"
>
  <div class="hidden lg:block sticky top-0 bg-[color-mix(in_srgb,var(--color-bg)_92%,transparent)] backdrop-blur-md z-10 px-2 border-b border-[var(--color-border)]">
    <div class="grid grid-cols-2">
      <button
        type="button"
        (click)="onSelectFeed('for-you')"
        class="relative py-3 text-sm font-bold"
        [class.text-[var(--color-text)]]="activeFeed() === 'for-you'"
        [class.text-[var(--color-muted)]]="activeFeed() !== 'for-you'"
      >
        For you
        @if (activeFeed() === 'for-you') {
          <span class="absolute bottom-0 left-1/2 -translate-x-1/2 h-1 w-14 rounded-full bg-[var(--color-primary)]"></span>
        }
      </button>

      <button
        type="button"
        (click)="onSelectFeed('following')"
        class="relative py-3 text-sm font-bold"
        [class.text-[var(--color-text)]]="activeFeed() === 'following'"
        [class.text-[var(--color-muted)]]="activeFeed() !== 'following'"
      >
        Following
        @if (activeFeed() === 'following') {
          <span class="absolute bottom-0 left-1/2 -translate-x-1/2 h-1 w-14 rounded-full bg-[var(--color-primary)]"></span>
        }
      </button>
    </div>
  </div>

  <app-create-post></app-create-post>

  <div class="flex max-w-full gap-2 justify-center py-3 px-3 border-b border-[var(--color-border)]">
    <select
      (change)="onChangeSort($event)"
      [value]="sort()"
      class="bg-[var(--color-input)] text-[var(--color-text)] border-[var(--color-border)] border px-3 py-2 rounded-full text-sm flex-1 max-w-[110px]"
    >
      <option value="recent" class="bg-[var(--color-input)]">Recent</option>
      <option value="likes" class="bg-[var(--color-input)]">Likes</option>
    </select>

    <input
      type="text"
      [value]="userName()"
      #searchBox
      class="bg-[var(--color-input)] text-[var(--color-text)] border-[var(--color-border)] border px-4 py-2 rounded-full text-sm flex-1 max-w-[180px]"
      placeholder="Search by user..."
      [disabled]="activeFeed() === 'following'"
    />

    <button
      (click)="onSearch(searchBox.value)"
      class="bg-[var(--color-primary)] text-white p-2 rounded-full text-sm md:px-4 px-3 font-semibold"
      [disabled]="activeFeed() === 'following'"
    >
      Search
    </button>

    <button
      (click)="onReset()"
      class="bg-transparent border border-[var(--color-border)] text-[var(--color-text)] p-2 rounded-full text-sm md:px-4 px-3 font-semibold hover:bg-[var(--color-input)]"
      [disabled]="activeFeed() === 'following'"
    >
      Reset
    </button>
  </div>

  @for (item of posts(); track item._id) {
    <app-post
      [title]="item.title"
      [content]="item.message"
      [imageUrl]="item.photo"
      [author]="item.author.username"
      [authorId]="item.author._id"
      [authorPhoto]="item.author.photo"
      [date]="item.createdAt"
      [id]="item._id"
      [likes]="item.likes"
      [likeCount]="item.likeCount"
      [commentCount]="item.commentCount"
      [comments]="item.comments"
      [mediaType]="item.mediaType"
    />
  }

  <div #scrollSentinel class="h-10 flex justify-center items-center text-sm text-gray-500">
    @if (hasMorePosts()) {
      <p>Load more posts...</p>
    } @else {
      <p>No more posts to load.</p>
    }
  </div>

  @if (loading()) {
    <div
      class="fixed top-0 left-0 right-0 bottom-0 flex justify-center items-center backdrop-blur-sm"
    >
      <spinner></spinner>
    </div>
  }
</div>
